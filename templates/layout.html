{{define "head"}}
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>arkserver-panel</title>
  <style>
    :root { color-scheme: light dark; --line: #8883; --muted: #8888; }
    body { font: 16px/1.5 system-ui, sans-serif; margin: 0 auto; max-width: 60rem; padding: 1.5rem; }
    h1 { font-size: 1.25rem; margin: 0 0 1rem; }
    h2 { font-size: .8rem; font-weight: 600; letter-spacing: .04em; text-transform: uppercase;
         color: var(--muted); margin: 0 0 .5rem; }
    nav { display: flex; gap: 1rem; margin-bottom: 1.25rem; border-bottom: 1px solid var(--line);
          padding-bottom: .5rem; }
    nav a { color: inherit; text-decoration: none; padding-bottom: .5rem; margin-bottom: -.55rem; }
    nav a.active { border-bottom: 2px solid currentColor; font-weight: 600; }
    .bar { display: flex; align-items: center; gap: .75rem; flex-wrap: wrap;
           border: 1px solid var(--line); border-radius: .5rem; padding: .75rem 1rem; }
    .spacer { flex: 1 }
    .inline { display: inline }
    button { font: inherit; padding: .4rem .9rem; border: 1px solid var(--line);
             border-radius: .35rem; background: transparent; color: inherit; cursor: pointer; }
    button:disabled { opacity: .4; cursor: not-allowed; }
    .dot { width: .7rem; height: .7rem; border-radius: 50%; background: var(--muted); }
    .dot.laeuft { background: #2e9e4f } .dot.startet { background: #d38b1a }
    .dot.gestoppt { background: #b3402f } .dot.unbekannt { background: var(--muted) }
    .grid { display: grid; gap: 1rem; margin-top: 1rem;
            grid-template-columns: repeat(auto-fit, minmax(11rem, 1fr)); }
    .card { border: 1px solid var(--line); border-radius: .5rem; padding: 1rem; }
    .figure { font-size: 2rem; margin: 0; line-height: 1.1; }
    .figure.small { font-size: 1.4rem }
    .unit { font-size: .8rem; color: var(--muted); margin-left: .4rem; }
    .muted { color: var(--muted) }
    .meter { height: .4rem; border-radius: .2rem; background: var(--line); margin-top: .6rem; }
    .meter span { display: block; height: 100%; border-radius: .2rem; background: #2e9e4f; }
    .players { margin: .5rem 0 0; padding-left: 1.1rem; font-size: .9rem; }
    .notices { margin: 1rem 0 0; padding-left: 1.1rem; font-size: .9rem; color: var(--muted); }
    .tabs { display: flex; gap: .5rem; flex-wrap: wrap; margin-bottom: 1rem; }
    .tabs a { font-size: .9rem; padding: .3rem .7rem; border: 1px solid var(--line);
              border-radius: .35rem; text-decoration: none; color: inherit; }
    .tabs a.active { border-color: currentColor; font-weight: 600; }
    .tabs a.missing { opacity: .45 }
    textarea { width: 100%; box-sizing: border-box; min-height: 26rem; font: 13px/1.45 ui-monospace,
               monospace; padding: .75rem; border: 1px solid var(--line); border-radius: .5rem;
               background: transparent; color: inherit; }
    textarea[readonly] { opacity: .85 }
    pre.log { max-height: 32rem; overflow: auto; font: 12px/1.45 ui-monospace, monospace;
              border: 1px solid var(--line); border-radius: .5rem; padding: .75rem; margin: 0; }
    .actions { display: flex; align-items: center; gap: .75rem; margin-top: .75rem; }
    .flash { border: 1px solid var(--line); border-radius: .35rem; padding: .5rem .8rem;
             font-size: .9rem; margin-bottom: 1rem; }
    .flash.bad { border-color: #b3402f }
    .hint { font-size: .85rem; color: var(--muted); margin: .5rem 0 0; }
  </style>
{{end}}

{{define "nav"}}
<nav>
  <a href="/" {{if eq . "monitor"}}class="active"{{end}}>Monitor</a>
  <a href="/files" {{if eq . "files"}}class="active"{{end}}>Dateien</a>
  <a href="/logs" {{if eq . "logs"}}class="active"{{end}}>Logs</a>
</nav>
{{end}}
