<!doctype html>
<html lang="de">
<head>{{template "head" .}}</head>
<body>
  <h1>arkserver-panel</h1>
  {{template "nav" "monitor"}}
  <div id="status">{{template "status" .}}</div>

  <script>
    // Poll the fragment instead of the page, so the scroll position and any open confirm dialog
    // survive. Skipped while the tab is hidden: a background tab does not need the traffic.
    const status = document.getElementById("status");
    async function refresh() {
      if (document.hidden) return;
      try {
        const html = await (await fetch("/status", { headers: { "Accept": "text/html" } })).text();
        status.innerHTML = html;
      } catch (e) { /* a missed poll is not worth showing; the next one follows */ }
    }
    setInterval(refresh, 5000);
    document.addEventListener("visibilitychange", () => { if (!document.hidden) refresh(); });
  </script>
</body>
</html>
