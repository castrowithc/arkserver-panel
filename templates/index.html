<!doctype html>
<html lang="de">
<head>{{template "head" .Chrome}}</head>
<body>
  {{template "topbar" .Chrome}}
  <aside class="sidebar">{{template "navlinks" .Chrome.Active}}</aside>

  <main>
    <div id="status">{{template "status" .Status}}</div>
  </main>

  <script>
    // Poll the fragment instead of the page, so the scroll position and any open confirm dialog
    // survive. Skipped while the tab is hidden: a background tab does not need the traffic.
    const status = document.getElementById("status");
    async function refresh() {
      if (document.hidden) return;
      try {
        const html = await (await fetch("/status", { headers: { "Accept": "text/html" } })).text();
        // The poll replaces the whole fragment, so anything the reader opened would snap shut every
        // five seconds, right while they are reading it. Carry the open ones over by id.
        const open = [...status.querySelectorAll("details[id]")].filter(d => d.open).map(d => d.id);
        status.innerHTML = html;
        for (const id of open) {
          const d = status.querySelector("details#" + CSS.escape(id));
          if (d) d.open = true;
        }
      } catch (e) { /* a missed poll is not worth showing; the next one follows */ }
    }
    setInterval(refresh, 5000);
    document.addEventListener("visibilitychange", () => { if (!document.hidden) refresh(); });
  </script>
</body>
</html>
